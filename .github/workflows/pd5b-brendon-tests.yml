# TEAM CODE (integration: Brendon) - written by the BJT2 team, not generated by STM32CubeMX.
name: PD5b Brendon host tests

on:
  push:
    paths:
      - "PD5b_Brendon/**"
      - ".github/workflows/pd5b-brendon-tests.yml"
  pull_request:
    paths:
      - "PD5b_Brendon/**"

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S PD5b_Brendon -B PD5b_Brendon/build/ci -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build PD5b_Brendon/build/ci
      - name: Test
        run: ctest --test-dir PD5b_Brendon/build/ci --output-on-failure
