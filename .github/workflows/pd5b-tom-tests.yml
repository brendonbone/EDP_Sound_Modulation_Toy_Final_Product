# TEAM CODE (integration: Brendon) - written by the BJT2 team, not generated by STM32CubeMX.
# Authors: Tom's original workflow (imported with PD5b_Tom); Brendon moved it to the repo root and scoped it to PD5b_Tom (Sep 2026).
name: PD5b Tom host tests

on:
  push:
    paths:
      - "PD5b_Tom/**"
      - ".github/workflows/pd5b-tom-tests.yml"
  pull_request:
    paths:
      - "PD5b_Tom/**"

jobs:
  host-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PD5b_Tom
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: cmake --preset host-linux
      - name: Build
        run: cmake --build --preset host-linux
      - name: Test
        run: ctest --preset host-linux --output-on-failure
